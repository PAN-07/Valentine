<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine?</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #0f0f0f;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  color: white;
}

/* MUTE BUTTON */
#muteToggle {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 100;
  background: #222;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 13px;
}

.card {
  width: 360px;
  background: #111;
  border-radius: 14px;
  border: 1px solid #222;
  box-shadow: 0 0 40px rgba(255,0,80,0.25);
  overflow: visible;
  z-index: 1;
  position: relative;   /* ADD THIS */
}

.header {
  display: flex;
  align-items: center;
  padding: 12px;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg,#ff004c,#ff5f9e);
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
  margin-right: 10px;
}

.username {
  font-weight: 600;
}

.post {
  height: 300px;
  background: linear-gradient(135deg,#ff004c,#ff5f9e);
  display: flex;
  flex-direction: column;   /* ADD THIS */
  justify-content: center;
  align-items: center;
  text-align: center;
  font-size: 16px;
  padding: 20px;
}

.actions {
  padding: 15px;
  display: flex;
  justify-content: space-between; 
  align-items: center;
  position: relative;   /* important */
}

button {
  width: 130px;
  padding: 12px;
  margin: 0;
  border-radius: 30px;
  border: none;
  font-size: 15px;
  cursor: pointer;
  transition: 0.2s;
  display: flex;
  justify-content: center;
  align-items: center;
}

#yes {
  background: #ff004c;
  color: white;
}

#no {
  background: #333;
  color: #aaa;
}

.caption {
  padding: 0 15px 15px;
  font-size: 14px;
  color: #ccc;
}

.dm {
  position: fixed;
  bottom: -140px;
  right: 20px;
  width: 280px;
  background: #111;
  border-radius: 14px;
  box-shadow: 0 0 30px rgba(255,0,80,0.4);
  padding: 12px;
  display: flex;
  align-items: center;
  transition: 0.5s;
  z-index: 10;
}

.dm.show {
  bottom: 20px;
}

.dm-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #ff004c;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
  margin-right: 10px;
}

.dm-text {
  font-size: 14px;
}

.seen {
  font-size: 12px;
  color: gray;
  margin-top: 4px;
}

.typing {
  font-size: 12px;
  color: #aaa;
  margin-top: 4px;
}
</style>
</head>

<body>

<button id="muteToggle">🔊 Sound On</button>

<audio id="music" autoplay loop>
  <source src="shaggy-angel.mp3">
</audio>

<div class="card">
  <div class="header">
    <img class="avatar" src="hmm.jpeg" alt="avatar">
    <div class="username">hdhsjsjdjhdkjd</div>
  </div>

  <div class="post">
    Wanna hangout tmr? If you are not tired tht is 🥰<br>
    <small>(Please don’t say no we will crunch leafs!)</small>
  </div>

  <div class="actions">
    <button id="yes">YES 😱</button>
    <button id="no">OKAY 😔</button>
  </div>

  <div class="caption">
    <b></b>
  </div>
</div>

<!-- DM POPUP -->
<div class="dm" id="dm">
  <img class="dm-avatar" src="gay.jpeg" alt="dm-avatar">
  <div class="dm-text" id="dmText">
    wya?
    <div class="seen">Seen 👀</div>
  </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const dm = document.getElementById("dm");
const dmText = document.getElementById("dmText");
const music = document.getElementById("music");
const muteToggle = document.getElementById("muteToggle");

let scale = 1;
let yesScale = 1;

const noLines = [
  "HAWWWW ❌",
  "AREY YAAR WHAT DID I DO? 😭",
  "SERIOUSLY NIGA 💀",
  "NUH HUH",
  "AREY PLS YAAAARR",
  "NO OPTION LEFT, JUST GONNA KMS"
];

let noCount = 0;

document.body.addEventListener("click", () => {
  music.play();
},{once:true});

/* MUTE / UNMUTE */
muteToggle.addEventListener("click", () => {
  music.muted = !music.muted;
  muteToggle.innerText = music.muted ? "🔇 Muted" : "🔊 Sound On";
});

let firstEscape = true;

noBtn.addEventListener("mouseover", () => {

  if (firstEscape) {

    // Center YES using flex
    const actions = document.querySelector(".actions");
    actions.style.justifyContent = "center";

    // Make NO absolute relative to the page
    noBtn.style.position = "fixed";

    firstEscape = false;
  }

  // Move NO anywhere on screen
  const maxX = window.innerWidth - noBtn.offsetWidth;
  const maxY = window.innerHeight - noBtn.offsetHeight;

  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top = Math.random() * maxY + "px";

  // Shrink NO
  scale -= 0.1;
  noBtn.style.transform = `scale(${scale})`;

  noBtn.innerText = noLines[noCount % noLines.length];
  noCount++;

  // Grow YES
  yesScale += 0.08;
  yesBtn.style.transform = `scale(${yesScale})`;
});

// DM CHAOS TIMELINE
setTimeout(() => dm.classList.add("show"), 2000);

setTimeout(() => {
  dmText.innerHTML = `Typing…<div class="typing">typing…</div>`;
}, 4000);

setTimeout(() => {
  dmText.innerHTML = `Still typing…<div class="typing">slow ahh</div>`;
}, 6000);

setTimeout(() => {
  dmText.innerHTML = `Seen again 💔<div class="seen">ignored. as usual.</div>`;
}, 8500);

setTimeout(() => {
  dmText.innerHTML = `are you mad at me?<div class="seen">Seen </div>`;
}, 11000);

// YES BUTTON
yesBtn.addEventListener("click", () => {
  document.body.innerHTML = `
  <div style="
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:black;
    color:white;">
    <h1 style="color:#ff004c;">WOW I THOUGHT I WOULD GET IGNORED...</h1>
    <h1 style="color:#ff004c;">(LIKE MAGNIFICAT DAY)</h1>
    <h2>😔💔</h2>
  </div>`;
});
</script>

</body>
</html>
